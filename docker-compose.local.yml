services:
  watchtower:
    container_name: watchtower
    image: watchtower:local
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      # Watchtower needs read/write access to manage containers (no :ro)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Uncomment and set these as needed:
      # WATCHTOWER_SCHEDULE: "0 0 4 * * *"  # Run at 4am daily (cron format)
      # WATCHTOWER_CLEANUP: "true"          # Remove old images after update
      # WATCHTOWER_INCLUDE_STOPPED: "false" # Don't update stopped containers
      # WATCHTOWER_REVIVE_STOPPED: "false"  # Don't restart stopped containers
      # WATCHTOWER_NOTIFICATIONS: "email"   # Notification type
      # WATCHTOWER_LABEL_ENABLE: "true"     # Only update labeled containers
      TZ: Europe/London
    command:
      - --interval
      - "86400"    # Check every 24 hours (in seconds)
      - --cleanup  # Remove old images
      - --include-stopped  # Check stopped containers too
